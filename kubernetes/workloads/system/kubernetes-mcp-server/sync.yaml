---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kubernetes-mcp-server
spec:
  targetNamespace: kubernetes-mcp-server
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/workloads/system/kubernetes-mcp-server/manifests
  prune: true
  wait: true
