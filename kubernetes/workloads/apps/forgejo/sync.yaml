---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo
  namespace: flux-system
spec:
  targetNamespace: forgejo
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/workloads/apps/forgejo/manifests
  prune: true
  wait: true
  components:
    - ../../../../components/postgres
    - ../../../../components/volsync
  postBuild:
    substitute:
      APP: forgejo
      BACKUPS__S3_BUCKET: cluster-backups-4265
      BACKUPS__S3_ENDPOINT: s3.us-west-004.backblazeb2.com
      POSTGRES__VERSION: "16"
      VOLSYNC__CAPACITY: 50Gi
  patches:
    - patch: |-
        - op: replace
          path: /spec/users
          value:
            - name: forgejo
              databases:
                - forgejo
              password:
                type: AlphaNumeric
      target:
        kind: PostgresCluster
