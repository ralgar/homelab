---
# yaml-language-server: $schema=https://raw.githubusercontent.com/recyclarr/recyclarr/refs/tags/v8.0.0/schemas/config-schema.json
radarr:
  remux-web-1080p:
    base_url: http://radarr.media-server.svc.cluster.local:7878
    api_key: !env_var RADARR_API_KEY
    delete_old_custom_formats: true
    quality_definition:
      type: movie
    quality_profiles:
      # https://trash-guides.info/Radarr/radarr-setup-quality-profiles/#remux-web-1080p
      - trash_id: 9ca12ea80aa55ef916e3751f4b874151  # Remux + WEB 1080p
        reset_unmatched_scores:
          enabled: true

sonarr:
  web-1080p:
    base_url: http://sonarr.media-server.svc.cluster.local:8989
    api_key: !env_var SONARR_API_KEY
    delete_old_custom_formats: true
    quality_definition:
      type: series
    quality_profiles:
      # https://trash-guides.info/Sonarr/sonarr-setup-quality-profiles/#web-1080p
      - trash_id: 72dae194fc92bf828f32cde7744e51a1  # WEB-1080p
        reset_unmatched_scores:
          enabled: true
      - trash_id: 20e0fc959f1f1704bed501f23bdae76f  # [Anime] Remux-1080p
        min_format_score: 2000   # Reject anything that isn't Dual Audio or Dub Only
        reset_unmatched_scores:
          enabled: true
    custom_formats:
      - # No Audio Description
        trash_ids:
          - 44ccbcbc74506f208973e1463b11705f  # With Audio Description
        assign_scores_to:
          - trash_id: 72dae194fc92bf828f32cde7744e51a1  # WEB-1080p
            score: -10000
      - # [Anime] Dual Audio: Preferred
        trash_ids:
          - 418f50b10f1907201b6cfdf881f467b7  # [Anime] Dual Audio
        assign_scores_to:
          - trash_id: 20e0fc959f1f1704bed501f23bdae76f  # [Anime] Remux-1080p
            score: 3500
      - # [Anime] Dub Only: Acceptable
        trash_ids:
          - 9c14d194486c4014d422adc64092d794  # [Anime] Dub Only
        assign_scores_to:
          - trash_id: 20e0fc959f1f1704bed501f23bdae76f  # [Anime] Remux-1080p
            score: 2000
