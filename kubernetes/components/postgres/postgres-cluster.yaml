---
apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: ${APP}
spec:
  postgresVersion: ${POSTGRES__VERSION:=14}
  instances:
    - name: postgres
      dataVolumeClaimSpec:
        storageClassName: ${POSTGRES__STORAGE_CLASS:=premium-block}
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: ${POSTGRES__VOLUME_CAPACITY:=5Gi}
  users: []
  # patroni:
  #   dynamicConfiguration:
  #     postgresql:
  #       pg_hba:
  #         - "hostnossl all all all md5"  # Disable TLS
  dataSource:
    pgbackrest:
      configuration:
        - secret:
            name: ${APP}-pgbackrest-credentials
      global:
        process-max: "8"
        repo1-path: /pgbackrest/${APP}
        repo1-cipher-type: aes-256-cbc
        repo1-s3-uri-style: path
      repo:
        name: repo1
        s3:
          bucket: ${BACKUPS__S3_BUCKET}
          endpoint: ${BACKUPS__S3_ENDPOINT}
          region: ${BACKUPS__S3_REGION:=us-east-1}
  backups:
    pgbackrest:
      configuration:
        - secret:
            name: ${APP}-pgbackrest-credentials
      global:
        repo1-path: /pgbackrest/${APP}
        repo1-cipher-type: aes-256-cbc
        repo1-s3-uri-style: path
        repo1-retention-full: "30"  # Keep 30 full backups
        repo1-retention-full-type: count
        repo1-retention-archive-type: full
        repo1-retention-archive: "1"  # Only keep WAL until most recent full backup
        repo1-bundle: "y"
      repos:
        - name: repo1
          s3:
            bucket: ${BACKUPS__S3_BUCKET}
            endpoint: ${BACKUPS__S3_ENDPOINT}
            region: ${BACKUPS__S3_REGION:=us-east-1}
          schedules:
            full: "0 12 * * *"  # Full backup daily at 12 PM UTC (5:00 AM PDT)
